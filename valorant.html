<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YeG VALORANT 勢力図</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff; --bg-alt: #f0f4fa; --navy: #0c1f44; --navy-deep: #071228;
      --accent: #1648c8; --accent-glow: #4f7fff; --cyan: #0ea5c9;
      --text: #0c1f44; --text-sub: #374665; --text-light: #5a6a88;
      --border: #c8d3e8; --card: #ffffff; --gold: #b87200;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Noto Sans JP", sans-serif; background: var(--bg-alt); color: var(--text); }

    /* ナビゲーション */
    nav {
      background: var(--navy);
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo span { color: white; font-family: "Bebas Neue", sans-serif; font-size: 22px; letter-spacing: 2px; }
    .nav-links { display: flex; gap: 8px; list-style: none; }
    .nav-links a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: white;
      background: rgba(255,255,255,0.1);
    }
    .nav-links a.active { color: #4f7fff; }

    /* メインコンテンツ */
    .page-header {
      background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 100%);
      padding: 40px;
      color: white;
    }
    .page-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .page-header p { color: rgba(255,255,255,0.7); font-size: 14px; }

    .container { max-width: 1200px; margin: 0 auto; padding: 32px 40px; }

    .map-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      height: 560px;
    }

    #val-map {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .sidebar-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .sidebar-card h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .rank-list { display: flex; flex-direction: column; gap: 8px; }
    .rank-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 6px;
      background: var(--bg-alt);
      font-size: 13px;
    }
    .rank-num {
      font-weight: 700;
      color: var(--text-light);
      width: 20px;
      text-align: center;
    }
    .rank-name { flex: 1; font-weight: 500; }
    .rank-count { font-weight: 700; color: var(--accent); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(22, 72, 200, 0.1);
      color: var(--accent);
      margin-bottom: 8px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">
      <span>YeG</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">TOP</a></li>
      <li><a href="index.html#mission">ミッション</a></li>
      <li><a href="index.html#activities">活動内容</a></li>
      <li><a href="index.html#members">役員紹介</a></li>
      <li><a href="index.html#records">活動実績</a></li>
      <li><a href="news.html">活動記録</a></li>
      <li><a href="valorant.html" class="active">勢力図</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <h1>横須賀市高校 VALORANT 勢力図</h1>
    <p>YeG公式Discordサーバーで申告されたランク情報を自動集計しています。</p>
  </div>

  <div class="container">
    <div class="map-layout">
      <div id="val-map"></div>
      <div class="sidebar">
        <div class="sidebar-card">
          <div class="status-badge"><span class="dot"></span> サンプル表示中</div>
          <h3>加入者数ランキング</h3>
          <div class="rank-list" id="rank-list">
            <div class="rank-item"><span class="rank-num">-</span><span class="rank-name">データなし</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    // 正確な座標データ（NAVITIMEより取得）
    const schools = [
      { name: "追浜高校",        short: "追浜", lat: 35.320459, lng: 139.632173, count: 0 },
      { name: "横須賀高校",      short: "横高", lat: 35.257006, lng: 139.670255, count: 0 },
      { name: "横須賀工業高校",  short: "工業", lat: 35.255318, lng: 139.677026, count: 0 },
      { name: "大津高校",        short: "大津", lat: 35.270800, lng: 139.682400, count: 0 },
      { name: "横須賀学院高校",  short: "学院", lat: 35.284767, lng: 139.671915, count: 0 },
      { name: "横須賀総合高校",  short: "総合", lat: 35.229613, lng: 139.708970, count: 0 },
      { name: "三浦学苑高校",    short: "学苑", lat: 35.264200, lng: 139.662800, count: 0 },
      { name: "湘南学院高校",    short: "湘南", lat: 35.236500, lng: 139.697200, count: 0 },
      { name: "横須賀南高校",    short: "南高", lat: 35.228500, lng: 139.700200, count: 0 },
      { name: "津久井浜高校",    short: "津久井", lat: 35.207000, lng: 139.689500, count: 0 },
      { name: "海洋科学高校",    short: "海洋", lat: 35.242000, lng: 139.640000, count: 0 }
    ];

    // 地図初期化
    const map = L.map("val-map").setView([35.26, 139.67], 12);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap &copy; CartoDB",
      maxZoom: 18
    }).addTo(map);

    // summary.json を取得して反映
    fetch("summary.json")
      .then(r => r.json())
      .then(data => {
        if (data.schools) {
          data.schools.forEach(d => {
            const s = schools.find(s => s.name === d.name);
            if (s) s.count = d.total || 0;
          });
        }
        renderMap();
      })
      .catch(() => renderMap());

    function renderMap() {
      schools.sort((a, b) => b.count - a.count);

      // マーカーを配置
      schools.forEach((s, i) => {
        const radius = Math.max(10, Math.min(30, 10 + s.count * 3));
        L.circleMarker([s.lat, s.lng], {
          radius: radius,
          fillColor: "#1648c8",
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.7
        }).addTo(map)
          .bindTooltip(s.short, { permanent: true, direction: "center", className: "school-label" })
          .bindPopup("<b>" + s.name + "</b><br>加入者: " + s.count + "人");
      });

      // ランキング更新
      const list = document.getElementById("rank-list");
      list.innerHTML = schools.map((s, i) =>
        "<div class='rank-item'>" +
        "<span class='rank-num'>" + (i + 1) + "</span>" +
        "<span class='rank-name'>" + s.name + "</span>" +
        "<span class='rank-count'>" + s.count + "人</span>" +
        "</div>"
      ).join("");
    }
  </script>

  <style>
    .school-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      font-size: 10px;
      font-weight: 700;
      color: white;
    }
  </style>
</body>
</html>
